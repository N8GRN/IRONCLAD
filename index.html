<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>IRONCLAD CRM</title>
    <meta name="theme-color" content="#0d3b6e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IRONCLAD" />
    <meta name="description" content="Roofing CRM, estimator, and service agreements for Ironclad Roofing LLC." />
    <script>
      (function () {
        try {
          var p = localStorage.getItem("ironclad-theme-v1") || "system";
          var dark = p === "dark" || (p !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme-pref", p);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#101820" : "#0d3b6e");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app">
      <div style="min-height:100dvh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#1a2332;background:#f3efe6">
        <p>Loading IRONCLAD…</p>
      </div>
    </div>

    <!-- Firebase compat SDK (same project as before: ironclad-127a5) -->
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-messaging-compat.js"></script>

    <!-- App — edit these files; they are plain JS/CSS -->
    <script src="js/config.js"></script>
    <script src="js/util.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/estimate.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/contract.js"></script>
    <script src="js/store.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
